{% if sp.show_capabilities and capabilities %}
<section class="sv-section sv-caps">
    <div class="container">
        <header class="sv-head sv-head-center sv-head-dark" data-reveal>
            <span class="sv-badge"><i class="fas fa-microchip"></i> {{ sp.capabilities_badge }}</span>
            <h2>{{ sp.capabilities_title }}</h2>
            {% if sp.capabilities_text %}<p>{{ sp.capabilities_text }}</p>{% endif %}
        </header>
        <div class="sv-caps-grid">
            {% for c in capabilities %}
            <article class="sv-cap" data-reveal data-spotlight style="--i: {{ forloop.counter0 }}">
                <span class="sv-cap-icon"><i class="{{ c.icon }}"></i></span>
                <h3>{{ c.title }}</h3>
                <p>{{ c.description }}</p>
            </article>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
