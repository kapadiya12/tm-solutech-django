{% extends 'dashboard/base.html' %}
{% block dashboard_content %}
<div class="flex-between mb-8">
    <h2>{{ page_title }}</h2>
</div>
<div class="dashboard-card">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.help_text %}<p style="font-size: var(--text-xs); color: var(--gray-500); margin-top: var(--space-1);">{{ field.help_text }}</p>{% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save"></i> Save Settings</button>
    </form>
</div>
{% endblock %}
