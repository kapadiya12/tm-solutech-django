{% extends 'base.html' %}
{% load static %}
{% block title %}Page Not Found | TM Solutech{% endblock %}
{% block content %}
<section class="section" style="min-height: 60vh; display: flex; align-items: center;">
    <div class="container text-center">
        <h1 style="font-size: 8rem; color: var(--primary); line-height: 1; margin-bottom: var(--space-4);">404</h1>
        <h2 style="margin-bottom: var(--space-4);">Page Not Found</h2>
        <p style="max-width: 500px; margin: 0 auto var(--space-8);">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{% url 'core:home' %}" class="btn btn-primary"><i class="fas fa-home"></i> Back to Home</a>
    </div>
</section>
{% endblock %}
