{% extends 'dashboard/base.html' %}

{% block dashboard_content %}
<div class="mb-8">
    <h2>Change Password</h2>
</div>
<div class="dashboard-card" style="max-width: 480px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label class="form-label">{{ field.label }}</label>
            <input type="password" name="{{ field.html_name }}" class="form-control" {% if field.value %}value="{{ field.value }}"{% endif %}>
            {% if field.errors %}<div class="form-error">{{ field.errors.0 }}</div>{% endif %}
            {% if field.help_text %}<p style="font-size: 0.75rem; color: var(--gray-500); margin-top: 0.25rem;">{{ field.help_text }}</p>{% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Update Password</button>
    </form>
</div>
{% endblock %}
