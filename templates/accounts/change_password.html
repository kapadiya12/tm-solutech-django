{% extends 'dashboard/base.html' %}

{% block dashboard_content %}
<div class="section-header" style="text-align: left; margin-bottom: var(--space-8);">
    <h2>Change Password</h2>
</div>
<div style="max-width: 480px; background: var(--white); border-radius: var(--radius-xl); padding: var(--space-8); border: 1px solid var(--gray-200);">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label class="form-label">{{ field.label }}</label>
            <input type="password" name="{{ field.html_name }}" class="form-control" {% if field.value %}value="{{ field.value }}"{% endif %}>
            {% if field.errors %}<div class="form-error">{{ field.errors.0 }}</div>{% endif %}
            {% if field.help_text %}<p style="font-size: var(--text-xs); color: var(--gray-500); margin-top: var(--space-1);">{{ field.help_text }}</p>{% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Update Password</button>
    </form>
</div>
{% endblock %}
